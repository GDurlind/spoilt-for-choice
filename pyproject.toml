[tool.poetry]
name = "spoilt-for-choice"
version = "0.0.1"
description = "spoilt-for-choice"
authors = ["Gustav Durlind <gustav.durlind@hotmail.com>"]
readme = "README.md"

[[tool.poetry.packages]]
include = "options_engine"

[tool.poetry.dependencies]
python = "^3.14"
numpy = "^1.26.1"
pandas = "^2.2.2"
scipy = "^1.11.1"
matplotlib = "^3.8.1"
plotly = "^5.15.0"
streamlit = "^1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^24.0"
pre-commit = "^3.0"
jupyter = "^1.1.1"
ipykernel = "^7.3.0"
ipywidgets = "^8.1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
exclude = '''
/(\.git|\.venv|build|dist)/
'''

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["--maxfail=1"]
